<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#075E6B" />
    <meta name="application-name" content="40 Love Padel Club &amp; Cafe" />
    <meta name="apple-mobile-web-app-title" content="40 Love Padel Club &amp; Cafe" />
    <meta name="description" content="40 Love Padel Club &amp; Cafe in Amman, Jordan — three premium floodlit padel courts, open daily from 7 AM until 3 AM." />
    <meta property="og:site_name" content="40 Love Padel Club &amp; Cafe" />
    <meta property="og:title" content="40 Love Padel Club &amp; Cafe" />
    <meta property="og:description" content="Book padel at 40 Love Padel Club &amp; Cafe in Amman, Jordan. Three courts, open daily from 7 AM until 3 AM." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://40love.club" />
    <link rel="icon" type="image/png" href="/40love-logo-dark.png">
    <title>40 Love Padel Club &amp; Cafe</title>
    <!--
      Inline theme initialiser: runs synchronously before React mounts so
      the page is never briefly rendered in the wrong colour scheme.
      Reads 'serva-theme-v2' from localStorage (same key the app uses).
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('serva-theme-v2') || 'light';
          document.documentElement.dataset.theme = t;
          // Adjust theme-color meta for browser chrome
          var mc = document.querySelector('meta[name="theme-color"]');
          if (mc) mc.content = t === 'dark' ? '#075E6B' : '#F5F8F2';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
