<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#075E6B" />
    <meta name="application-name" content="40 Love Padel Club &amp; Cafe" />
    <meta name="apple-mobile-web-app-title" content="40 Love Padel Club &amp; Cafe" />
    <meta name="description" content="Play padel at 40 LOVE in Dahyet Al-Nakheel, Amman. Three floodlit courts and a courtside café, open daily from 7 AM until 3 AM." />
    <meta property="og:site_name" content="40 Love Padel Club &amp; Cafe" />
    <meta property="og:title" content="40 Love Padel Club &amp; Cafe" />
    <meta property="og:description" content="Book padel at 40 Love Padel Club &amp; Cafe in Amman, Jordan. Three courts, open daily from 7 AM until 3 AM." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://40love.club" />
    <link rel="icon" type="image/png" href="/40love-logo-dark.png">
    <title>40 Love Padel Club &amp; Cafe</title>
    <style>
      html:has(#root:empty), html:has(#root:empty) body { background-color: var(--initial-canvas); }
    </style>
    <!-- Match the first paint to the saved preferences while the app loads. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var dark = localStorage.getItem('serva-theme-v2') === 'dark';
          var canvas = dark ? '#142522' : '#f6f4ea';
          root.lang = localStorage.getItem('serva-locale') === 'ar' ? 'ar' : 'en';
          root.dir = root.lang === 'ar' ? 'rtl' : 'ltr';
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.setProperty('--initial-canvas', canvas);
          document.querySelector('meta[name="theme-color"]').content = canvas;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
