# Registers the database safety gate for every test class, including runs started
# directly from IntelliJ's JUnit runner (not only through Gradle).
# Verified against junit-jupiter-engine 6.0.3 (Constants + MutableExtensionRegistry).
junit.jupiter.extensions.autodetection.enabled=true
# Only this project's gate is auto-detected; extensions shipped in other jars are ignored.
junit.jupiter.extensions.autodetection.include=com.serva.booking.testsupport.DatabaseTestGate
