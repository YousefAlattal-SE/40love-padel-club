# Database-backed tests only (profile "test", activated by @DatabaseIntegrationTest).
# Values come from FORTYLOVE_TEST_* variables that `gradlew databaseTest` forwards after
# validating them. There are deliberately no defaults: a missing value fails start-up.
spring.datasource.url=${FORTYLOVE_TEST_DB_URL}
spring.datasource.username=${FORTYLOVE_TEST_DB_USERNAME}
spring.datasource.password=${FORTYLOVE_TEST_DB_PASSWORD}

# Server-side check on every new connection (defence in depth; the client-side gate and
# guard refuse unsafe targets before any connection). FORTYLOVE_TEST_SYSTEM_IDENTIFIER is
# validated as digits-only by TestDatabaseGuard before this SQL can be used.
spring.datasource.hikari.connection-init-sql=DO $$ BEGIN IF session_user <> 'fortylove_app' OR current_user <> 'fortylove_app' THEN RAISE EXCEPTION 'Expected the restricted application login'; END IF; IF current_database() <> 'fortylove' THEN RAISE EXCEPTION 'Unexpected test database'; END IF; IF (SELECT system_identifier::text FROM pg_control_system()) <> '${FORTYLOVE_TEST_SYSTEM_IDENTIFIER}' THEN RAISE EXCEPTION 'Not the disposable test cluster'; END IF; END $$;

# Tests never migrate or initialise schema/data.
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate

# Logs each pool's JDBC URL (password masked by Hikari) as evidence of the target.
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

# Integration tests drive many member writes from one address (127.0.0.1) within seconds. The write
# limiter itself is covered by ApiLimitsFilterTest; production keeps API_WRITE_PER_MINUTE=30.
app.api.write-per-minute=600

# Two existing tests exercise legacy login. JWT_SECRET is generated per run by Gradle.
app.auth.legacy-jwt-enabled=true

# Non-secret placeholders. The JWKS endpoint is fetched lazily and never reached by tests.
app.clerk.issuer=https://clerk.test.invalid
app.clerk.authorized-parties=http://localhost:5173
app.clerk.audience=fortylove-api-test
app.clerk.secret-key=unused-test-value
