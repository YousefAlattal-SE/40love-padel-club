# ==========================================
# 40 LOVE - Production Configuration
# ==========================================

spring.application.name=fortylove

# Database - required environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Database schema management
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migrations are deployed separately
spring.flyway.enabled=false

# JWT - legacy authentication is disabled in production, so no JWT_SECRET is required
app.jwt.expiration-minutes=30

# Clerk Authentication
app.clerk.enabled=true
app.clerk.issuer=${CLERK_ISSUER}
app.clerk.audience=${CLERK_API_AUDIENCE}
app.clerk.authorized-parties=${CLERK_AUTHORIZED_PARTIES}
app.clerk.secret-key=${CLERK_SECRET_KEY}
app.clerk.allow-audienceless=false

# Trusted frontend origin
app.public-origin=${APP_PUBLIC_ORIGIN}

# API limits
app.api.general-per-minute=240
app.api.sensitive-per-minute=20
app.api.write-per-minute=30
# Set to the reverse proxy's IP/CIDR once the hosting is chosen; empty trusts nobody.
app.security.trusted-proxies=${TRUSTED_PROXIES:}

# HTTP server
server.port=${PORT:8080}

# Error response hardening
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Disable legacy JWT authentication in production
app.auth.legacy-jwt-enabled=false