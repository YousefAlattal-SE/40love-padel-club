
spring.application.name=fortylove

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/fortylove}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Reject accidental use of a migration/owner login by the application pool.
spring.datasource.hikari.connection-init-sql=DO $$ BEGIN IF session_user <> 'fortylove_app' OR current_user <> 'fortylove_app' THEN RAISE EXCEPTION 'Expected the restricted application login'; END IF; END $$;
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${FLYWAY_USERNAME}
spring.flyway.password=${FLYWAY_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_LIFETIME_MINUTES:30}

app.clerk.enabled=${CLERK_AUTH_ENABLED:true}
app.clerk.issuer=${CLERK_ISSUER:}
app.clerk.audience=${CLERK_API_AUDIENCE:}
app.clerk.authorized-parties=${CLERK_AUTHORIZED_PARTIES:}
app.clerk.secret-key=${CLERK_SECRET_KEY:}

app.clerk.allow-audienceless=${CLERK_ALLOW_AUDIENCELESS:false}
server.forward-headers-strategy=none
app.public-origin=${APP_PUBLIC_ORIGIN:}
app.api.general-per-minute=${API_GENERAL_PER_MINUTE:240}
app.api.sensitive-per-minute=${API_SENSITIVE_PER_MINUTE:20}
