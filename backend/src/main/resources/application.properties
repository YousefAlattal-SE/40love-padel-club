spring.application.name=fortylove

# Database
# DB_URL is required: there is deliberately no default, so nothing (including tests) can
# fall back to a protected database. Database tests use application-test.properties.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:fortylove_app}
spring.datasource.password=${DB_PASSWORD}

# Database security
spring.datasource.hikari.connection-init-sql=DO $$ BEGIN IF session_user <> 'fortylove_app' OR current_user <> 'fortylove_app' THEN RAISE EXCEPTION 'Expected the restricted application login'; END IF; END $$;

# Flyway
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate

# Legacy JWT (password login) is off unless explicitly enabled. JWT_SECRET is only
# needed when it is enabled.
app.auth.legacy-jwt-enabled=${LEGACY_JWT_ENABLED:false}

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_LIFETIME_MINUTES:30}

# Clerk
app.clerk.enabled=${CLERK_AUTH_ENABLED:true}
app.clerk.issuer=${CLERK_ISSUER:}
app.clerk.audience=${CLERK_API_AUDIENCE:}
app.clerk.authorized-parties=${CLERK_AUTHORIZED_PARTIES:}
app.clerk.secret-key=${CLERK_SECRET_KEY:}
app.clerk.allow-audienceless=${CLERK_ALLOW_AUDIENCELESS:false}

# Security
server.forward-headers-strategy=none
app.public-origin=${APP_PUBLIC_ORIGIN:}
app.api.general-per-minute=${API_GENERAL_PER_MINUTE:240}
app.api.sensitive-per-minute=${API_SENSITIVE_PER_MINUTE:20}
app.api.write-per-minute=${API_WRITE_PER_MINUTE:30}
# Comma-separated IPs/CIDRs of the reverse proxy. Empty = trust nobody (X-Forwarded-For ignored).
app.security.trusted-proxies=${TRUSTED_PROXIES:}

# Local server
server.port=18080